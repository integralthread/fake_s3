[tools]
erlang = "28.3"
elixir = "1.19.4-otp-28"

# Used by test_aws_cli.sh, which drives the server with a real S3 client.
awscli = "2.36.28"
shellcheck = "0.11.0"
shfmt = "3.13.1"

# Used to run the vendored ceph/s3-tests suite (boto3 + pytest).
python = "3.12"
uv = "0.11.16"

[bootstrap.repos]
"vendor/s3-tests" = { url = "git@github.com:ceph/s3-tests.git", ref = "master" }

# bootstrap.repos only clones; the suite is Python/boto3 and needs its own venv.
[bootstrap.hooks]
post-repos = "mise run s3-tests-install"

[env]
# Where `mise bootstrap` clones third-party test suites.
VENDOR_DIR = "{{config_root}}/vendor"
S3TEST_CONF = "{{config_root}}/s3tests.conf"

[tasks.deps]
description = "Fetch and compile dependencies"
run = "mix deps.get"

[tasks.compile]
description = "Compile with warnings as errors"
depends = ["deps"]
run = "mix compile --warnings-as-errors"

[tasks.server]
description = "Run the server (FAKES3_PORT, FAKES3_HOST, FAKES3_DATA_DIR)"
depends = ["deps"]
run = "mix run --no-halt"

[tasks.test]
description = "Run the test suite"
depends = ["deps"]
run = "mix test"

[tasks.format]
description = "Format Elixir sources and shell scripts"
run = ["mix format", "shfmt -w -i 4 test_aws_cli.sh"]

[tasks.lint]
description = "Check formatting and lint the shell test script"
run = [
  "mix format --check-formatted",
  "shfmt -d -i 4 test_aws_cli.sh",
  "shellcheck test_aws_cli.sh",
]

[tasks.test-aws-cli]
description = "Run the AWS CLI contract script (starts a server if none is running)"
depends = ["deps"]
run = """
#!/usr/bin/env bash
set -euo pipefail

endpoint="http://127.0.0.1:${FAKES3_PORT:-4569}"

# Reuse a server the user already has up; otherwise run a throwaway one against
# a temp data dir so the suite never scribbles on real FAKES3_DATA_DIR state.
if curl -sf "$endpoint/__health" >/dev/null 2>&1; then
  exec ./test_aws_cli.sh "$endpoint"
fi

data_dir="$(mktemp -d)"
server_log="$data_dir/server.log"

# Server logs go to a file, not the terminal: interleaved request lines bury the
# suite's own PASS/FAIL output. Dumped below only if startup fails.
FAKES3_DATA_DIR="$data_dir" mix run --no-halt >"$server_log" 2>&1 &
server_pid=$!
trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; rm -rf "$data_dir"' EXIT

for _ in $(seq 50); do
  curl -sf "$endpoint/__health" >/dev/null 2>&1 && break
  kill -0 "$server_pid" 2>/dev/null || { echo "server exited during startup:" >&2; cat "$server_log" >&2; exit 1; }
  sleep 0.2
done

if ! curl -sf "$endpoint/__health" >/dev/null 2>&1; then
  echo "server did not become healthy at $endpoint within 10s:" >&2
  cat "$server_log" >&2
  exit 1
fi

./test_aws_cli.sh "$endpoint"
"""

[tasks.check]
description = "Everything CI should run"
depends = ["lint", "compile", "test"]

[tasks.s3-tests-install]
description = "Build the venv for the cloned ceph/s3-tests checkout"
run = """
#!/usr/bin/env bash
set -euo pipefail

repo="$VENDOR_DIR/s3-tests"
if [ ! -d "$repo" ]; then
  echo "$repo is missing; run 'mise bootstrap' to clone it" >&2
  exit 1
fi

# Kept out of anything global: these deps are unrelated to our mix deps.
uv venv --python 3.12 "$repo/.venv"
VIRTUAL_ENV="$repo/.venv" uv pip install -r "$repo/requirements.txt" -e "$repo"

echo "==> ready; run 'mise run server' then 'mise run s3-tests'"
"""

[tasks.s3-tests]
description = "Run ceph/s3-tests against a running FakeS3 server"
run = """
#!/usr/bin/env bash
set -euo pipefail

# Not `dir = ...` on the task: mise fails to cd before this guard can explain why.
repo="$VENDOR_DIR/s3-tests"
if [ ! -x "$repo/.venv/bin/pytest" ]; then
  echo "vendor/s3-tests is not set up; run 'mise bootstrap' first" >&2
  exit 1
fi

# pytest.ini (which registers the suite's markers) lives at the repo root.
cd "$repo"

# Default to the main S3 functional file. Anything passed after `--` replaces
# it, e.g. `mise run s3-tests -- s3tests/functional/test_s3.py::test_bucket_list_empty`.
if [ "$#" -eq 0 ]; then
  set -- s3tests/functional/test_s3.py
fi

exec .venv/bin/pytest "$@"
"""

[tasks."bedrock:server"]
description = "Run strict-auth S3 for local Bedrock development"
dir = "{{config_root}}"
depends = ["deps"]
run = "mix run --no-halt"

[tasks."bedrock:server".env]
FAKES3_HOST = "127.0.0.1"
FAKES3_PORT = "4569"
FAKES3_DATA_DIR = "{{config_root}}/.fakes3-bedrock"
FAKES3_MODE = "strict"
FAKES3_ACCESS_KEY = "bedrock-local"
FAKES3_SECRET_KEY = "bedrock-local-secret"
FAKES3_REGION = "us-east-1"

[tasks."bedrock:bucket"]
description = "Create the local Bedrock bucket if missing (server must be running)"
dir = "{{config_root}}"
run = '''
set -eu
aws --endpoint-url http://127.0.0.1:4569 s3api head-bucket --bucket bedrock >/dev/null 2>&1 ||
  aws --endpoint-url http://127.0.0.1:4569 s3api create-bucket --bucket bedrock
'''

[tasks."bedrock:bucket".env]
AWS_ACCESS_KEY_ID = "bedrock-local"
AWS_SECRET_ACCESS_KEY = "bedrock-local-secret"
AWS_DEFAULT_REGION = "us-east-1"
AWS_EC2_METADATA_DISABLED = "true"

[tasks."test:bedrock"]
description = "Run the real Bedrock S3 adapter and publication recovery tests"
depends = ["deps"]
run = "mix test test/bedrock_contract_test.exs test/publication_test.exs"

[tasks."test:bedrock".env]
FAKES3_PORT = "0"
